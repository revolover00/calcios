name: Deploy Calcios to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_GROQ_API_URL: ${{ vars.VITE_GROQ_API_URL || secrets.VITE_GROQ_API_URL || vars.GROQ_API_URL || secrets.GROQ_API_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          VITE_GROQ_MODEL: ${{ vars.VITE_GROQ_MODEL || secrets.VITE_GROQ_MODEL || vars.GROQ_MODEL || secrets.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 || vars.GROQ_API_KEY_1 || secrets.VITE_GROQ_API_KEY_1 || vars.VITE_GROQ_API_KEY_1 || '' }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 || vars.GROQ_API_KEY_2 || secrets.VITE_GROQ_API_KEY_2 || vars.VITE_GROQ_API_KEY_2 || '' }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 || vars.GROQ_API_KEY_3 || secrets.VITE_GROQ_API_KEY_3 || vars.VITE_GROQ_API_KEY_3 || '' }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 || vars.GROQ_API_KEY_4 || secrets.VITE_GROQ_API_KEY_4 || vars.VITE_GROQ_API_KEY_4 || '' }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 || vars.GROQ_API_KEY_5 || secrets.VITE_GROQ_API_KEY_5 || vars.VITE_GROQ_API_KEY_5 || '' }}
        run: |
          configured_keys=0
          for i in 1 2 3 4 5; do
            key_name="GROQ_API_KEY_${i}"
            if [[ -n "${!key_name}" ]]; then
              ((configured_keys += 1))
            fi
          done
          echo "Groq scanner keys available to Pages build: ${configured_keys}/5" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$configured_keys" -eq 0 ]]; then
            echo "No GROQ_API_KEY_1..5 values were found in the github-pages environment secrets/variables."
            exit 1
          fi
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
