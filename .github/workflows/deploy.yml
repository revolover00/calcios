name: Deploy Calcios to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_GROQ_API_URL: ${{ vars.VITE_GROQ_API_URL || secrets.VITE_GROQ_API_URL || vars.GROQ_API_URL || secrets.GROQ_API_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          VITE_GROQ_MODEL: ${{ vars.VITE_GROQ_MODEL || secrets.VITE_GROQ_MODEL || vars.GROQ_MODEL || secrets.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY || secrets.GROQ_API_KEY || vars.VITE_GROQ_API_KEY || '' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
